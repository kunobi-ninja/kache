name: Fuzz

on:
  schedule:
    # Off the top of the hour to reduce GitHub cron scheduling congestion.
    - cron: "23 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "fuzz/**"
      - "src/checked_regions.rs"
      - "src/native_archive.rs"

permissions:
  contents: read

concurrency:
  group: fuzz-native-archive-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

jobs:
  native-archive:
    name: Native archive parser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-05-16 --profile minimal --component rust-src

      - name: Verify independent fuzz lock
        run: cargo +nightly-2026-05-16 metadata --manifest-path fuzz/Cargo.toml --locked --no-deps --format-version 1 > /dev/null

      - name: Install cargo-fuzz
        shell: bash
        run: |
          archive="$RUNNER_TEMP/cargo-fuzz-0.13.1.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            https://github.com/rust-fuzz/cargo-fuzz/releases/download/0.13.1/cargo-fuzz-0.13.1-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' \
            86edc9b8f20c29ff07c3e5fcd67bc3f0784b3b960a5428635060f20d50555461 \
            "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" \
            --directory "$(dirname "$(command -v cargo)")" cargo-fuzz
          cargo fuzz --version

      - name: Compile every fuzz target
        if: github.event_name == 'pull_request'
        run: >-
          cargo +nightly-2026-05-16 fuzz check
          --target x86_64-unknown-linux-gnu

      - name: Generate structurally valid seed corpus
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          seed_dir="$RUNNER_TEMP/native-archive-seeds"
          mkdir -p "$seed_dir"
          KACHE_FUZZ_SEED_DIR="$seed_dir" cargo test --locked --bin kache \
            native_archive::tests::emit_fuzz_seed_corpus -- --ignored --exact
          echo "KACHE_FUZZ_SEED_DIR=$seed_dir" >> "$GITHUB_ENV"

      - name: Restore evolving coverage corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/native-archive-seeds
          key: native-archive-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            native-archive-corpus-${{ runner.os }}-

      - name: Fuzz bounded native archive inputs
        if: github.event_name != 'pull_request'
        run: >-
          cargo +nightly-2026-05-16 fuzz run
          --target x86_64-unknown-linux-gnu
          native_archive
          "$KACHE_FUZZ_SEED_DIR" --
          -max_total_time=600
          -max_len=1048576
          -rss_limit_mb=2048
          -timeout=5

      - name: Upload crash reproducers
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-archive-fuzz-artifacts-${{ github.run_id }}
          path: fuzz/artifacts/native_archive
          if-no-files-found: ignore
          retention-days: 14

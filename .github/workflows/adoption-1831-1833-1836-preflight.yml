name: Adoption preflight (1839 candidate 3)

on:
  push:
    branches: [review-contribution/preflight-1831-1833-1836]
    paths: [.github/workflows/adoption-1831-1833-1836-preflight.yml]

permissions:
  contents: read

concurrency:
  group: adoption-1831-1833-1836-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Prepare PR ${{ matrix.pr }} (${{ matrix.platform }})
    if: >-
      github.repository == 'kunobi-ninja/kache' &&
      !github.event.repository.private &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/review-contribution/preflight-1831-1833-1836'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - pr: "1833"
            platform: Linux
            runner: ubuntu-latest
            install_args: rust github:casey/just
            head: 3ad77367ee406d2b272778846f02b564dd4f381f
            tree: 8bcba38a771fdc81b0eec5f329bc60a25d4791ab
          - pr: "1833"
            platform: macOS
            runner: macos-latest
            install_args: rust github:casey/just
            head: 3ad77367ee406d2b272778846f02b564dd4f381f
            tree: 8bcba38a771fdc81b0eec5f329bc60a25d4791ab
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      RUSTC_WRAPPER: ""
      RUSTC_WORKSPACE_WRAPPER: ""
      KACHE_TEST_USE_CARGO_BIN_EXE: "1"
      KACHE_SELF_HOST: "0"
      SOURCE_PR: ${{ matrix.pr }}
      SOURCE_HEAD: ${{ matrix.head }}
      SOURCE_TREE: ${{ matrix.tree }}
    steps:
      - name: Require a disposable hosted runner
        working-directory: ${{ github.workspace }}
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$RUNNER_KIND" = github-hosted
          {
            printf 'CARGO_TARGET_DIR=%s/adoption-target\n' "$RUNNER_TEMP"
            printf 'EVIDENCE_DIR=%s/adoption-evidence\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - name: Check out the maintainer validation helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the pinned candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.SOURCE_HEAD }}
          path: source
          persist-credentials: false
      - name: Verify source and record provenance
        env:
          RUNNER_KIND: ${{ runner.environment }}
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          {
            printf 'helper_head=%s\n' "$GITHUB_SHA"
            printf 'source_head=%s\n' "$SOURCE_HEAD"
            printf 'source_tree=%s\n' "$SOURCE_TREE"
            printf 'runner_environment=%s\n' "$RUNNER_KIND"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'runner_arch=%s\n' "$RUNNER_ARCHITECTURE"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
          } | tee "$EVIDENCE_DIR/provenance.txt"
      - uses: zondax/actions/setup-runner@8d9900cca4563d4356c5e76c1fa49913158196d4 # v1.5.2
      - uses: zondax/actions/setup-mise@14e656f2dcc6012c36298e3a6e95dc4ae0f022f0 # v1.5.3
        with:
          version: 2026.6.9
          install: true
          install_args: ${{ matrix.install_args }}
          cache: false
      - name: Prove the macOS arm-before-park regression rejects late registration
        if: matrix.platform == 'macOS'
        run: |
          set -euo pipefail
          trap 'git restore --source="$SOURCE_HEAD" -- src/scheduler/permit_wait.rs' EXIT
          cat > "$EVIDENCE_DIR/mac-registration-negative.patch" <<'NEGATIVE_PATCH'
          --- a/src/scheduler/permit_wait.rs
          +++ b/src/scheduler/permit_wait.rs
          @@ -181,7 +181,12 @@
                       return None;
                   }
                   let watch = Self { kq, files };
          -        let changes: Vec<libc::kevent> = watch
          +        Some(watch)
          +    }
          +
          +    #[mutants::skip]
          +    fn stay(&self, limit: Duration) -> Option<libc::kevent> {
          +        let changes: Vec<libc::kevent> = self
                       .files
                       .iter()
                       .map(|file| libc::kevent {
          @@ -193,27 +198,6 @@
                           udata: std::ptr::null_mut(),
                       })
                       .collect();
          -        let timeout = timespec(Duration::ZERO);
          -        // Register before the caller rescans the slots. With no output list,
          -        // this call keeps an unlock pending and reports registration errors
          -        // through its return value. `watch` owns all descriptors on failure.
          -        // SAFETY: the descriptors, changelist and zero timeout outlive the
          -        // call; the null output pointer has an event count of zero.
          -        let registered = unsafe {
          -            libc::kevent(
          -                watch.kq,
          -                changes.as_ptr(),
          -                changes.len() as libc::c_int,
          -                std::ptr::null_mut(),
          -                0,
          -                &timeout,
          -            )
          -        };
          -        (registered >= 0).then_some(watch)
          -    }
          -
          -    #[mutants::skip]
          -    fn stay(&self, limit: Duration) -> Option<libc::kevent> {
                   let deadline = std::time::Instant::now() + limit;
                   let mut event = libc::kevent {
                       ident: 0,
          @@ -230,7 +214,7 @@
                       // are submitted here. `event` and `timeout` outlive the call,
                       // and the watched descriptors stay open on `self`.
                       let ready =
          -                unsafe { libc::kevent(self.kq, std::ptr::null(), 0, &mut event, 1, &timeout) };
          +                unsafe { libc::kevent(self.kq, changes.as_ptr(), changes.len() as libc::c_int, &mut event, 1, &timeout) };
                       if ready > 0 {
                           return Some(event);
                       }
          NEGATIVE_PATCH
          git apply --check "$EVIDENCE_DIR/mac-registration-negative.patch"
          git apply "$EVIDENCE_DIR/mac-registration-negative.patch"
          set +e
          cargo test --locked -p kache --lib scheduler::permit_wait::mac_tests::an_unlock_before_parking_remains_a_kernel_event -- --exact --nocapture 2>&1 | tee "$EVIDENCE_DIR/mac-registration-negative.log"
          result=("${PIPESTATUS[@]}")
          set -e
          test "${result[0]}" -eq 101
          test "${result[1]}" -eq 0
          grep -Fxq 'running 1 test' "$EVIDENCE_DIR/mac-registration-negative.log"
          grep -Fq 'test result: FAILED. 0 passed; 1 failed;' "$EVIDENCE_DIR/mac-registration-negative.log"
          grep -Fq 'the unlock must already be pending; no polling timeout can satisfy this' "$EVIDENCE_DIR/mac-registration-negative.log"
          git restore --source="$SOURCE_HEAD" -- src/scheduler/permit_wait.rs
          git diff --exit-code
          trap - EXIT
      - name: Run focused regressions
        run: |
          set -euo pipefail
          test "$SOURCE_PR" = 1833
          for regression in a_finished_cargo_run_leaves_no_lease_record a_signalled_cargo_run_releases_its_lease_before_reraising_the_signal a_cargo_spawn_error_releases_its_lease_and_remains_an_error; do
            cargo test --locked -p kache --test cargo_proxy_test "$regression" -- --exact --nocapture 2>&1 | tee "$EVIDENCE_DIR/$regression.log"
            grep -Fq 'test result: ok. 1 passed; 0 failed;' "$EVIDENCE_DIR/$regression.log"
          done
          if [ "${{ matrix.platform }}" = macOS ]; then
            for regression in scheduler::tests::dropping_a_permit_wakes_the_waiter scheduler::permit_wait::mac_tests::an_unlock_before_parking_remains_a_kernel_event scheduler::permit_wait::mac_tests::a_held_permit_has_no_pending_unlock; do
              log="$EVIDENCE_DIR/${regression//::/-}.log"
              cargo test --locked -p kache --lib "$regression" -- --exact --nocapture 2>&1 | tee "$log"
              grep -Fq 'test result: ok. 1 passed; 0 failed;' "$log"
            done
          fi
      - name: Run repository checks
        if: matrix.platform == 'Linux'
        run: |
          set -euo pipefail
          just check 2>&1 | tee "$EVIDENCE_DIR/just-check.log"
      - name: Check documentation routes and source parity
        if: matrix.platform == 'Linux'
        run: |
          set -euo pipefail
          bash scripts/check-docs.sh 2>&1 | tee "$EVIDENCE_DIR/docs-check.log"
          python3 scripts/test-docs.py 2>&1 | tee "$EVIDENCE_DIR/docs-tests.log"
      - name: Verify the candidate was not changed
        if: always()
        run: git diff --exit-code
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adoption-${{ matrix.pr }}-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 7
          if-no-files-found: error

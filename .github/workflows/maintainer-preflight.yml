name: Maintainer preflight (1680 mutation proof)

on:
  push:
    branches: [validation/preflight-1680-manifests]
    paths: [.github/workflows/maintainer-preflight.yml]

permissions:
  contents: read

jobs:
  preflight:
    name: Manifest parser and key checks (Linux)
    if: github.repository == 'kunobi-ninja/kache' && github.ref == 'refs/heads/validation/preflight-1680-manifests'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: ""
      KACHE_TEST_USE_CARGO_BIN_EXE: "1"
      CARGO_BUILD_JOBS: "2"
      EXPECTED_HEAD: 5afa58d1972dbadf267c0ff8f835b37b70e6226e
      EXPECTED_TREE: 69f668b03e200c5b501983825a7f1f25c7184be9
      BASE_HEAD: cabbf2bcf0a4a017fb59836bbc6c0ef3b785448e
    steps:
      - name: Record provenance and require an ephemeral hosted runner
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/preflight-1680/evidence"
          mkdir -p "$evidence"
          printf 'EVIDENCE_DIR=%s\n' "$evidence" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/preflight-1680/target" >> "$GITHUB_ENV"
          printf 'helper=%s\nrun=%s\nrunner=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RUNNER_KIND" | tee "$evidence/provenance.txt"
          test "$RUNNER_KIND" = github-hosted
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 5afa58d1972dbadf267c0ff8f835b37b70e6226e
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate
        id: verify
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          printf 'tested_head=%s\ntested_tree=%s\n' "$EXPECTED_HEAD" "$EXPECTED_TREE" >> "$EVIDENCE_DIR/provenance.txt"
      - uses: zondax/actions/setup-runner@8d9900cca4563d4356c5e76c1fa49913158196d4 # v1.5.2
      - uses: zondax/actions/setup-mise@14e656f2dcc6012c36298e3a6e95dc4ae0f022f0 # v1.5.3
        with:
          version: 2026.6.9
          install: true
          cache: false
      - name: Record toolchain
        run: |
          set -euo pipefail
          rustc --version --verbose | tee "$EVIDENCE_DIR/toolchain.txt"
          cargo --version | tee -a "$EVIDENCE_DIR/toolchain.txt"
          just --version | tee -a "$EVIDENCE_DIR/toolchain.txt"
      - name: Check closed XML and manifest key controls
        id: green
        run: |
          set -euo pipefail
          cargo test --locked -p kache --lib windows_defaultlib -- --nocapture
          cargo test --locked -p kache --lib guarded_tool_directory_identity -- --nocapture
          cargo test --locked -p kache --lib guarded_absence -- --nocapture
          cargo test --locked -p kache --lib guarded_inputs -- --nocapture
          cargo test --locked -p kache --lib key_inputs_changed -- --nocapture
          cargo test --locked -p kache --lib manifest -- --nocapture 2>&1 | tee "$EVIDENCE_DIR/manifest-tests.log"
      - name: Prove refusal tests kill the reported mutations
        id: controls
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib
          import os
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          evidence = Path(os.environ["EVIDENCE_DIR"]) / "mutation-controls"
          evidence.mkdir(parents=True, exist_ok=True)
          manifest = Path("src/windows_manifest.rs").read_text()
          namespace_start = manifest.index("fn known_namespace(")
          namespace_end = manifest.index("\nfn attributes(", namespace_start)
          namespace = manifest[namespace_start:namespace_end]
          cache = Path("src/cache_key.rs").read_text()
          confirm_start = cache.index("fn confirm_missing_tool_directory(")
          confirm_end = cache.index("\n/// Thin abstraction", confirm_start)
          confirm = cache[confirm_start:confirm_end]
          native = Path("src/native_link_key.rs").read_text()
          selector_start = native.index("pub(crate) fn select_windows_manifest_tool<")
          shadow_guard = native.index("Err(error) if error.kind() == std::io::ErrorKind::NotFound", selector_start)
          selector_prefix = native[selector_start:shadow_guard]
          selector_needle = selector_prefix + "Err(error) if error.kind() == std::io::ErrorKind::NotFound"
          cases = [
              ("unknown-namespace", "src/windows_manifest.rs", namespace,
               "fn known_namespace(_namespace: &str) -> bool { true }\n",
               "windows_manifest::tests::file_bearing_and_unmodeled_xml_shapes_are_refused"),
              ("attribute-quote-state", "src/windows_manifest.rs",
               "quote.is_none() && matches!(byte, b'\\'' | b'\"')",
               "quote.is_none() || matches!(byte, b'\\'' | b'\"')",
               "windows_manifest::tests::attribute_whitespace_and_embedded_quotes_remain_well_formed"),
              ("first-absence-check", "src/cache_key.rs", confirm,
               confirm.replace("if error.kind() != std::io::ErrorKind::NotFound {", "if false {", 1),
               "missing_tool_directory_requires_both_observations_to_report_not_found"),
              ("second-absence-check", "src/cache_key.rs", confirm,
               confirm.replace("Err(error) if error.kind() == std::io::ErrorKind::NotFound => Ok(())", "Err(_error) if true => Ok(())", 1),
               "missing_tool_directory_requires_both_observations_to_report_not_found"),
              ("shadow-absence-check", "src/native_link_key.rs", selector_needle,
               selector_prefix + "Err(_error) if true",
               "manifest_merger_shadow_lookup_errors_are_not_recorded_as_absences"),
          ]
          for name, filename, needle, replacement, test in cases:
              path = Path(filename)
              original = path.read_text()
              if needle == replacement or original.count(needle) != 1:
                  raise SystemExit(f"Mutation {name} has no unique source match")
              changed = original.replace(needle, replacement, 1)
              (evidence / f"{name}.diff").write_text("".join(difflib.unified_diff(
                  original.splitlines(keepends=True), changed.splitlines(keepends=True),
                  fromfile=filename, tofile=filename)))
              try:
                  path.write_text(changed)
                  result = subprocess.run(["cargo", "test", "--locked", "-p", "kache", "--lib", test,
                                           "--", "--nocapture"], stdout=subprocess.PIPE,
                                          stderr=subprocess.STDOUT, text=True, timeout=600)
                  (evidence / f"{name}.log").write_text(result.stdout)
                  if result.returncode == 0 or "test result: FAILED" not in result.stdout:
                      raise SystemExit(f"Mutation {name} was not killed by a failing test")
                  print(f"CAUGHT {name}: {test}", flush=True)
              finally:
                  path.write_text(original)
          subprocess.run(["cargo", "test", "--locked", "-p", "kache", "--lib", "manifest", "--", "--nocapture"], check=True)
          PY
      - name: Check documentation
        id: docs
        run: |
          set -euo pipefail
          bash scripts/check-docs.sh 2>&1 | tee "$EVIDENCE_DIR/docs-check.log"
      - name: Record outcomes
        if: always()
        env:
          VERIFY: ${{ steps.verify.outcome }}
          GREEN: ${{ steps.green.outcome }}
          CONTROLS: ${{ steps.controls.outcome }}
          DOCS: ${{ steps.docs.outcome }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          printf 'verify=%s\ngreen=%s\nmutation_controls=%s\ndocs=%s\n' "$VERIFY" "$GREEN" "$CONTROLS" "$DOCS" | tee "$EVIDENCE_DIR/outcomes.txt"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintainer-preflight-1680-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 7
          if-no-files-found: error


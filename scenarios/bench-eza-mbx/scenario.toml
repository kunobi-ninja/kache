# Same source, toolchain and build profile as bench-eza.
name = "bench-eza-mbx"
tags = ["suite:bench", "project:eza", "backend:mbx", "lang:rust", "lang:cc"]

requires = ["cargo", "rustc", "cc"]

setup = [
  "echo '[bench] bench-eza-mbx needs a C compiler (bundled libgit2 and zlib through cc-rs). No OpenSSL: eza takes git2 with default-features off.'",
]

prepare = "cargo fetch --locked"

build = """

repo="$(pwd -P)"
prefix_map="-ffile-prefix-map=$repo=. -fdebug-prefix-map=$repo=. -fmacro-prefix-map=$repo=."
export CFLAGS="${CFLAGS:-} $prefix_map"
export CXXFLAGS="${CXXFLAGS:-} $prefix_map"
export SOURCE_DATE_EPOCH=1735689600
export ZERO_AR_DATE=1

cargo build --release --locked
"""

[source]
kind   = "clone"
repo   = "https://github.com/eza-community/eza.git"
ref    = "98442ab17c2c3738701b62a7e060b1431ae2d6ea"
objdir = "target"

[checks.measure.warm]
min_hit_rate_pct = 50.0

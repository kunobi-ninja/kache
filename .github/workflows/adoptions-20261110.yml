name: Adoption preflight November 10

on:
  push:
    branches: [validation/adoptions-20261110]
    paths: [.github/workflows/adoptions-20261110.yml]

permissions:
  contents: read

concurrency:
  group: adoption-preflight-20261110
  cancel-in-progress: false

jobs:
  nix-published:
    name: Nix published channel PR1866
    # PR1866 already passed just check in run42796448370/job129762745657.
    # Published channel retains the staging hook and SQLite without its mass rebuild.
    if: github.repository == 'kunobi-ninja/kache' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUSTC_WRAPPER: ""
      NIXPKGS_REV: f4a03c008967841f2a0b3cb7c436fc6fc31671f6
      EXPECTED_HEAD: 2e573c619464ad2fbd5a015e495462defe7be949
      EXPECTED_TREE: 4fb130c9915545e2cfc7c90667ecb50ef62c7595
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 2e573c619464ad2fbd5a015e495462defe7be949
          persist-credentials: false
      - name: Verify pinned candidate
        run: |
          mkdir -p "$RUNNER_TEMP/adoption-evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          git log -1 --format='%H%n%T%n%an <%ae>%n%cn <%ce>' > "$RUNNER_TEMP/adoption-evidence/candidate.txt"
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        timeout-minutes: 10
      - name: Evaluate supported Nix systems with published system-library hook
        run: nix flake check --all-systems --no-build --no-write-lock-file --override-input nixpkgs "github:NixOS/nixpkgs/$NIXPKGS_REV" 2>&1 | tee "$RUNNER_TEMP/adoption-evidence/nix-eval.log"
      - name: Build existing flake checks with published system-library hook
        run: nix flake check --keep-going --print-build-logs --no-write-lock-file --override-input nixpkgs "github:NixOS/nixpkgs/$NIXPKGS_REV" 2>&1 | tee "$RUNNER_TEMP/adoption-evidence/nix-build.log"
      - name: Record system library versions and runtime closure
        run: |
          nix eval --raw "github:NixOS/nixpkgs/$NIXPKGS_REV#legacyPackages.x86_64-linux.sqlite.version" > "$RUNNER_TEMP/adoption-evidence/sqlite-version.txt"
          nix eval --raw "github:NixOS/nixpkgs/$NIXPKGS_REV#legacyPackages.x86_64-linux.zstd.version" > "$RUNNER_TEMP/adoption-evidence/zstd-version.txt"
          package=$(nix build --no-link --print-out-paths --no-write-lock-file --override-input nixpkgs "github:NixOS/nixpkgs/$NIXPKGS_REV" .#packages.x86_64-linux.default)
          nix-store --query --requisites "$package" > "$RUNNER_TEMP/adoption-evidence/runtime-closure.txt"
          test "$(cat "$RUNNER_TEMP/adoption-evidence/sqlite-version.txt")" = 3.54.0
          grep -E '/[^/]*-sqlite-3[.]54[.]0($|-)' "$RUNNER_TEMP/adoption-evidence/runtime-closure.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: adoption-1866-nix-published
          path: ${{ runner.temp }}/adoption-evidence/
          retention-days: 7

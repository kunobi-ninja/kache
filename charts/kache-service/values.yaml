# Pins the rendered app name to `kache`, which is what every resource and —
# critically — every selector label already uses in the clusters running this
# chart. Selector labels are immutable on a Deployment, so letting the rendered
# name follow the chart rename below would make the next upgrade fail rather
# than roll.
nameOverride: "kache"
fullnameOverride: ""

replicaCount: 1

image:
  repository: zondax/kache
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

planner:
  name: planner
  dbPath: /var/lib/kache/planner.db
  seedStateFile: ""
  persistence:
    enabled: true
    type: ephemeral
    mountPath: /var/lib/kache
    size: 10Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce

auth:
  existingSecret: ""
  existingSecretKey: token

ha:
  enabled: false
  leaseName: kache-service
  namespace: ""
  serviceAccount:
    create: true
    name: ""

logLevel: "kache_service=info"

service:
  type: ClusterIP
  port: 8080
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}

# SigNoz metrics scraping (how the planner's Prometheus metrics reach SigNoz).
#
# The cluster's SigNoz OTel collector discovers scrape targets by pod
# annotations (signoz.io/scrape|port|path) — NOT by Prometheus ServiceMonitors,
# because these clusters run no Prometheus to consume them. The planner always
# serves /metrics on the http port (auth-exempt, like the health probes), so
# this is ON by default; the annotations are inert on any cluster without a
# SigNoz collector watching for them.
signoz:
  scrape: true
  path: /metrics
  # port: defaults to service.port (the http port serving /metrics)

# kache-e2e fixture: cross-tree active-reader isolation (#794).
#
# Two target dirs share one cache. The first target may be the blob's single
# hardlink carrier on a non-CoW filesystem; later restores must be private
# before their write-clock stamp. The contract in cross-tree.sh holds tree
# A's rlib open across tree B's restore and requires stable metadata,
# distinct consumer inodes, and immediate zero-dispatch convergence.
#
# The hardlink case engages where reflink is unavailable (ext4: e2e-docker
# and Linux CI). APFS restores reflink to fresh inodes, so the fixture still
# runs there as a lifecycle smoke without the Linux active-FD assertion.

name = "e2e-rust-cross-tree"
tags = ["suite:e2e", "lang:rust", "case:concurrency"]

[source]
kind = "fixture"
path = "source"

[env]
RUSTC_WRAPPER = "$KACHE"

[commands]
build = "sh cross-tree.sh"
clean = "rm -rf ta tb"

[verify]
run = "./ta/release/app"
expected_stdout_contains = ["cross-tree: 42"]

[assertions.cold]
min_entries_after = 1
# Tree B is a cache-backed warmup even during the harness's cold phase.
min_hits = 1

[assertions.warm]
min_hits = 1

# The script converges both trees before it exits, so by the noop phase
# every build inside it is a true no-op: no wrapper events beyond probe
# passthroughs. This is the strengthened #679 noop assertion applied to
# the cross-tree dance as a whole.
[assertions.noop]
should_not_recompile = true
recompile_marker = "Compiling"

name: Adoption preflight (1790)

on:
  push:
    branches: [review-contribution/preflight-1790-sanitize-restore]
    paths:
      - .github/workflows/adoption-restore-preflight.yml
      - scripts/adoption/restore-reason-controls.py

permissions:
  contents: read

concurrency:
  group: adoption-restore-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Restore preflight (${{ matrix.platform }})
    if: >-
      github.repository == 'kunobi-ninja/kache' &&
      !github.event.repository.private &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/review-contribution/preflight-1790-sanitize-restore'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            install_args: ""
            control: persisted
          - platform: macOS
            runner: macos-latest
            install_args: rust
            control: warning
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      RUSTC_WRAPPER: ""
      KACHE_TEST_USE_CARGO_BIN_EXE: "1"
      SOURCE_HEAD: c128eabd556b3be3c098ebde24ba5d91a6e9955a
      SOURCE_TREE: 9494183b0f4c452128853c34f0374f270811720d
    steps:
      - name: Require a disposable hosted runner
        working-directory: ${{ github.workspace }}
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$RUNNER_KIND" = github-hosted
          {
            printf 'CARGO_TARGET_DIR=%s/adoption-1790-target\n' "$RUNNER_TEMP"
            printf 'EVIDENCE_DIR=%s/adoption-1790-evidence\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - name: Check out the maintainer validation helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the pinned candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.SOURCE_HEAD }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source and record provenance
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          {
            printf 'helper_head=%s\n' "$GITHUB_SHA"
            printf 'source_head=%s\n' "$SOURCE_HEAD"
            printf 'source_tree=%s\n' "$SOURCE_TREE"
            printf 'runner_environment=%s\n' "$RUNNER_KIND"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
          } | tee "$EVIDENCE_DIR/provenance.txt"
      - uses: zondax/actions/setup-runner@8d9900cca4563d4356c5e76c1fa49913158196d4
      - uses: zondax/actions/setup-mise@14e656f2dcc6012c36298e3a6e95dc4ae0f022f0
        with:
          version: 2026.6.9
          install: true
          install_args: ${{ matrix.install_args }}
          cache: false
      - name: Run just check and documentation checks
        if: matrix.platform == 'Linux'
        run: |
          set -euo pipefail
          just check 2>&1 | tee "$EVIDENCE_DIR/just-check.log"
          bash scripts/check-docs.sh 2>&1 | tee "$EVIDENCE_DIR/docs-check.log"
      - name: Run macOS checks and the real debug-bundle controls
        if: matrix.platform == 'macOS'
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee "$EVIDENCE_DIR/clippy.log"
          cargo test --locked --test macos_debug_bundle_policy_test -- --test-threads=1 2>&1 | tee "$EVIDENCE_DIR/debug-bundle.log"
      - name: Verify that an actual regression is caught
        env:
          CONTROL_CASE: ${{ matrix.control }}
        run: python3 ../scripts/adoption/restore-reason-controls.py --case "$CONTROL_CASE"
      - name: Verify that the candidate was restored
        if: always()
        run: git diff --exit-code
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: adoption-1790-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 7
          if-no-files-found: error

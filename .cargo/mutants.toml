# Keep mutation runs focused on semantic failures rather than lint or copied
# scratch-data noise. Scope, baseline, and time limits stay explicit per lane.
cap_lints = true
gitignore = true

# Two independent reasons a mutant here is unobservable rather than untested.
#
# `run_config_editor` and `run_monitor` are TUI entry points: each enables raw
# mode, takes over the alternate screen, and runs an event loop until the user
# quits. Nothing can drive those functions from a test — CI has no TTY at all,
# and a test that did get one would seize the developer's terminal and then
# block — so a replaced body is unobservable and survives by construction
# rather than from a coverage gap. Kept as narrow as possible: the pure state,
# scheduling, scan, and rendering helpers called by both entry points stay in
# scope and are mutation-tested normally.
#
# The mutation lane runs on ubuntu-latest, so a mutant inside code compiled only
# for another platform is never built and therefore always "survives" — that is
# a property of where the lane runs, not a gap in the tests. `probe_macos` is
# `#[cfg(target_os = "macos")]` and `probe_unsupported` covers the remaining
# targets; both are unreachable there.
#
# Kept as narrow as the names allow: `probe_linux` — the one impl the lane does
# compile — stays fully in scope, along with `fiemap_window_length`,
# `Sharing::unknown_for`, and every caller. macOS coverage comes from the
# module's own tests, which do run on the macOS arm of `Test (macOS)`.

#
# `AttrList` is listed separately because a struct-field mutant's name does not
# carry the enclosing function, so "probe_macos" alone does not match it. The
# struct is declared inside `probe_macos` and exists nowhere else, so naming it
# is exactly as narrow.
#
# C/C++ output independence has three cfg-selected implementations. The Linux
# lane exercises the Unix implementation; the Windows body is covered by the
# Windows lane, while unsupported targets deliberately use a constant fallback.
#
# Kani proof harnesses are compiled and executed only by `cargo kani`; the
# mutation lane's `cargo test` process cannot observe changes under `cfg(kani)`.
# Their production target remains mutation-tested, while the harnesses are
# independently gated by the Kani proofs job.
#
# `run_gc_local` (CLI) and `Daemon::run_gc` gate progress strings and info
# logs on `count > 0` comparisons — "N entries updated." vs "up to date.",
# and whether a tracing line fires. Every `>` in both functions today is such
# a gate: which cosmetic string prints is unobservable from `cargo test`
# (stdout of the spawned CLI, daemon tracing output), while the counts
# themselves come from `Store::backfill_*` / eviction, which are
# mutation-tested directly. The `+` in `Daemon::run_gc` is the same shape:
# it sums two cohort counts purely to decide whether the shadow-demand info
# line prints (#594); the counts come from `shadow_demand_split`, which is
# tested directly. Revisit if either function ever grows a comparison or sum
# with semantic weight.
#
# `join_inflight_download` compares `Instant::now() < deadline` to decide
# whether a waiter may still adopt a newer leader generation. Flipping `<` to
# `<=` moves the boundary by one unmeasurable instant: distinguishing them
# requires the comparison to run at exactly the deadline nanosecond, which no
# test can arrange. The meaningful mutations of the same comparison (`==`,
# `>`, and the surrounding branch logic) are killed by the generation-adoption
# and give-up tests.
# `MacOsPlatform::package_debug_bundle` past its host gate is observable only
# where `dsymutil` runs: the macOS Test lane exercises it against a real
# binary (bundle produced, tar contents, determinism), but this lane is
# ubuntu, where the method returns None before any of that code executes —
# the probe_macos situation again, scoped to the one method. Its pure
# helpers (build_deterministic_tar, collect_files_recursively) are NOT
# excluded; Linux-runnable tests cover them.
#
# `default_cache_executables` is a per-platform constant: on this lane the
# real value IS true, so the with-true replacement is value-identical here
# (the with-false variant is caught); the macOS/Windows Test lanes pin
# their expected values.
#
# `touch_mtime_write_clock` ORs together disjoint open(2) flag bits, and
# `O_RDONLY` is zero: for disjoint operands `|` and `^` compute identical
# values, so those mutants are equivalent by construction, not untested.
# The `&` variants are excluded for lane economics, not lack of coverage:
# dropping O_NOFOLLOW is killed by the symlink-refusal test and dropping
# O_NONBLOCK by the FIFO-refusal test — but the latter's only observable
# effect is that the open BLOCKS, so the lane can only "kill" it by burning
# its full 300s timeout, which cargo-mutants then reports as a timeout
# failure rather than a catch. The tests remain the enforcement. The
# fd-validity comparison `raw < 0` mutated to `<= 0` misclassifies only
# fd 0, which `open` returns solely when stdin is closed — no test can
# arrange that without racing the whole test process's stdio; the `==` and
# `>` mutations of the same comparison are killed.
#
# `sample_write_clock` is `#[cfg(not(unix))]`: the same platform-lane
# property as `probe_macos` above — the ubuntu lane never compiles it, so
# every mutant inside it "survives" by construction. Its behavior is
# exercised by the Windows arm of `Test (Windows)` (the write-clock
# ordering test) and by the e2e lifecycle on the Windows runner.
#
# The two `windows_*` path adapters only translate host `Path` components into
# platform-neutral classifiers. Ubuntu cannot compile their Windows bodies;
# the classifiers remain in scope and have exhaustive Linux-runnable tests.
#
# `windows_kache_processes` is `#[cfg(windows)]`: the `sample_write_clock`
# property again — the ubuntu lane never compiles it, so every mutant inside
# it survives by construction. Kept as narrow as the name allows: the decision
# it feeds, `cmdline_is_daemon_run`, is deliberately `#[cfg(any(windows, test))]`
# precisely so this lane still mutation-tests the matching rule that decides
# which processes force_recover may kill.
#
# The two operator mutants inside `find_daemon_pids` are the same story: both
# live in its `#[cfg(windows)]` arm — `*pid != own_pid && cmdline_is_daemon_run(..)`
# — which this lane does not compile. Its Unix arm is untouched by the change
# that introduced these entries, so nothing here narrows coverage of the code
# the lane can actually reach. The function's return value stays fully in
# scope and is killed by tests asserting both directions: a process running a
# `kache` executable is found, and a shell whose command line merely mentions
# `kache daemon run` is not.
#
# The clean reclaim scanner has the same narrow platform boundary. The Windows
# syscall adapter and the unsupported-target wrapper are not compiled by the
# Ubuntu mutation lane, so replacement mutants inside those wrappers cannot be
# observed there. Their logic is deliberately extracted into the platform-neutral
# `windows_file_identity_from_parts`, `windows_storage_observation`, and
# `unsupported_storage_observation` helpers, which remain mutation-tested on
# Linux. Hosted Windows tests still exercise the real identity syscall, stable
# identity, link count, and failure behavior. Only the cfg-only adapters below
# are excluded.
#
# `run_cargo_non_unix` is the process-status half of the guarded Cargo
# front-end. The Ubuntu mutation lane compiles only the Unix `exec` half;
# hosted Windows tests still compile the status/exit-code path.
#
# `report_key_divergence` is a two-line stderr printer for the e2e convergence
# diagnostic. Its only effect is bytes on the e2e driver's stderr, which an
# in-process test cannot observe. Kept as narrow as the name allows: every
# decision it delegates to stays in scope and is killed by direct unit tests —
# `parse_keytrace` (which crate and field a trace line names),
# `render_key_divergence` (which fields count as diverged), and
# `key_divergence_report` (reading both phase logs off disk).
#
# `install_shims`'s two `!x.is_empty()` guards decide only which summary line
# prints ("Created N shim(s)" plus the optional created/skipped name lists).
# Nothing an in-process test can observe changes: the shim set it creates, the
# entries it preserves, and the errors it reports are all asserted directly by
# the tests around it. Same shape as the `run_gc_local` progress strings above.
# The function's behaviour, its `--force` semantics, and its error
# classification all stay in scope and are killed by those tests.
exclude_re = [
    "replace run_config_editor",
    "replace run_monitor",
    "probe_macos",
    "probe_unsupported",
    "from struct AttrList",
    "regular_output_is_independent_windows",
    "regular_output_is_independent_unsupported",
    "kani_proofs::",
    "replace > with (>=|<|==) in run_gc_local",
    "replace > with (>=|<|==) in Daemon::run_gc",
    "replace \\+ with . in Daemon::run_gc",
    "replace < with <= in join_inflight_download",
    "MacOsPlatform>::package_debug_bundle",
    "replace default_cache_executables -> bool with true",
    "replace \\| with \\^ in touch_mtime_write_clock",
    "replace \\| with & in touch_mtime_write_clock",
    "replace < with <= in touch_mtime_write_clock",
    "sample_write_clock",
    "NonInheritableStdio",
    "windows_pattern_has_ambiguous_root",
    "windows_path_uses_device_namespace",
    "windows_kache_processes",
    "replace && with \\|\\| in find_daemon_pids",
    "replace != with == in find_daemon_pids",
    "query_windows_file_identity",
    "observe_storage_windows",
    "observe_storage_unsupported",
    "run_cargo_non_unix",
    "replace report_key_divergence with \\(\\)",
    "delete ! in install_shims",
]

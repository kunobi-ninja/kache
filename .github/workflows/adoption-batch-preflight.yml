name: Declared input event diagnostic preflight (1819)

on:
  push:
    branches: [review-contribution/preflight-1819-events]
    paths: [.github/workflows/adoption-batch-preflight.yml]

permissions:
  contents: read

concurrency:
  group: event-diagnostic-1819-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose missing declared input events
    if: >-
      github.repository == 'kunobi-ninja/kache' &&
      !github.event.repository.private &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/review-contribution/preflight-1819-events'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      RUSTC_WRAPPER: ""
      RUSTC_WORKSPACE_WRAPPER: ""
      KACHE_TEST_USE_CARGO_BIN_EXE: "1"
      CARGO_INCREMENTAL: "1"
      PROPTEST_DISABLE_FAILURE_PERSISTENCE: "1"
      SOURCE_HEAD: c225fbf6f233d1b1f9e1ced83c532fd9bfc88450
      SOURCE_TREE: b6aec83fcb10c017449f014d0a4cc0807fc7743c
    steps:
      - name: Require a disposable hosted Linux runner
        working-directory: ${{ github.workspace }}
        env:
          RUNNER_KIND: ${{ runner.environment }}
          HOST_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          test "$RUNNER_KIND" = github-hosted
          test "$HOST_OS" = Linux
          {
            printf 'CARGO_TARGET_DIR=%s/event-diagnostic-target\n' "$RUNNER_TEMP"
            printf 'EVIDENCE_DIR=%s/event-diagnostic-evidence\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - name: Check out the maintainer validation helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the pinned diagnostic candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.SOURCE_HEAD }}
          path: source
          persist-credentials: false
      - name: Verify source and record provenance
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          {
            printf 'helper_head=%s\n' "$GITHUB_SHA"
            printf 'source_head=%s\n' "$SOURCE_HEAD"
            printf 'source_tree=%s\n' "$SOURCE_TREE"
            printf 'runner_environment=%s\n' "$RUNNER_KIND"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
          } | tee "$EVIDENCE_DIR/provenance.txt"
      - uses: zondax/actions/setup-runner@8d9900cca4563d4356c5e76c1fa49913158196d4 # v1.5.2
      - uses: zondax/actions/setup-mise@14e656f2dcc6012c36298e3a6e95dc4ae0f022f0 # v1.5.3
        with:
          version: 2026.6.9
          install: true
          install_args: rust
          cache: false
      - name: Repeat the failed ordinary Cargo fixture three times
        run: |
          set -euo pipefail
          printf 'trial\texit\n' > "$EVIDENCE_DIR/exits.tsv"
          failed=0
          for trial in 1 2 3; do
            log="$EVIDENCE_DIR/trial-$trial.log"
            set +e
            ./scripts/with-test-resources.sh cargo test --verbose --package=kache@2.0.1 \
              --all-features --test build_script_declared_inputs_test \
              declared_inputs_of_a_packages_build_script_key_its_units \
              -- --exact --nocapture 2>&1 | tee "$log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            status="${statuses[0]}"
            test "${statuses[1]}" -eq 0
            printf '%s\t%s\n' "$trial" "$status" | tee -a "$EVIDENCE_DIR/exits.tsv"
            if [ "$status" -ne 0 ]; then
              failed=1
              if [ ! -e "$EVIDENCE_DIR/first-failure.log" ]; then
                cp "$log" "$EVIDENCE_DIR/first-failure.log"
                printf '%s\t%s\n' "$trial" "$status" > "$EVIDENCE_DIR/first-failure.tsv"
              fi
            fi
          done
          exit "$failed"
      - name: Verify the candidate was not changed
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git diff --exit-code
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: event-diagnostic-1819-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 7
          if-no-files-found: error

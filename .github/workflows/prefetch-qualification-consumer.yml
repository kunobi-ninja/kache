name: Prefetch qualification consumer
on:
  workflow_call:
    inputs:
      arm:
        type: string
        required: true
      seed_run_id:
        type: string
        required: true
      seed_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  consume:
    name: consume
    if: github.repository == 'kunobi-ninja/kache' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.BENCH_RUNNER_LINUX || '"kunobi-runners"') }}
    timeout-minutes: 60
    steps:
      - name: Record first step before setup
        run: |
          mkdir -p "$RUNNER_TEMP/prefetch-result"
          date --utc --iso-8601=ns > "$RUNNER_TEMP/prefetch-result/first-step.txt"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            cmake libssl-dev git curl ca-certificates python3
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.9
          install_args: rust
          cache: false
          reshim: false
      - name: Install pinned workload toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prefetch-qualification-seed
          path: ${{ runner.temp }}/prefetch-seed
          run-id: ${{ inputs.seed_run_id }}
          github-token: ${{ github.token }}
      - name: Run isolated cold consumer
        env:
          ARM: ${{ inputs.arm }}
          SEED_RUN_ID: ${{ inputs.seed_run_id }}
          SEED_SHA: ${{ inputs.seed_sha }}
        run: |
          python3 scripts/prefetch-qualification.py consume \
            --root "$RUNNER_TEMP/prefetch-control" \
            --output "$RUNNER_TEMP/prefetch-result" \
            --archive "$RUNNER_TEMP/prefetch-seed/seed.tar.gz" \
            --seed-run-id "$SEED_RUN_ID" --seed-sha "$SEED_SHA" --arm "$ARM"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: prefetch-qualification-${{ inputs.arm }}
          path: ${{ runner.temp }}/prefetch-result
          if-no-files-found: error
          retention-days: 14

name: Maintainer preflight (1783)

on:
  push:
    branches: [validation/preflight-1783-demand-timeout]
    paths: [.github/workflows/maintainer-preflight.yml]

permissions:
  contents: read

jobs:
  preflight:
    name: Demand timeout red and green
    if: github.repository == 'kunobi-ninja/kache' && github.ref == 'refs/heads/validation/preflight-1783-demand-timeout'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: ""
      KACHE_TEST_USE_CARGO_BIN_EXE: "1"
      CARGO_BUILD_JOBS: "2"
      EXPECTED_HEAD: cb89b4ce4f0aaea5ecbc490f63f467795d9ab384
      EXPECTED_TREE: adb63275c383456446958d05e3b8f69abb1cfabe
      BASE_HEAD: 5c90a41e07eaeeedfcd57c0a08f5b501dc718e45
    steps:
      - name: Record provenance and require an ephemeral hosted runner
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/preflight-1783/evidence"
          mkdir -p "$evidence"
          printf 'EVIDENCE_DIR=%s\n' "$evidence" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/preflight-1783/target" >> "$GITHUB_ENV"
          printf 'helper=%s\nrun=%s\nrunner=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RUNNER_KIND" | tee "$evidence/provenance.txt"
          test "$RUNNER_KIND" = github-hosted
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: cb89b4ce4f0aaea5ecbc490f63f467795d9ab384
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate
        id: verify
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          printf 'tested_head=%s\ntested_tree=%s\n' "$EXPECTED_HEAD" "$EXPECTED_TREE" >> "$EVIDENCE_DIR/provenance.txt"
      - uses: zondax/actions/setup-runner@8d9900cca4563d4356c5e76c1fa49913158196d4 # v1.5.2
      - uses: zondax/actions/setup-mise@14e656f2dcc6012c36298e3a6e95dc4ae0f022f0 # v1.5.3
        with:
          version: 2026.6.9
          install: true
          cache: false
      - name: Record toolchain
        run: |
          set -euo pipefail
          rustc --version --verbose | tee "$EVIDENCE_DIR/toolchain.txt"
          cargo --version | tee -a "$EVIDENCE_DIR/toolchain.txt"
          just --version | tee -a "$EVIDENCE_DIR/toolchain.txt"
      - name: Verify regression fails on the old implementation
        id: red
        env:
          REGRESSION_PATCH_BASE64: 
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/demand-baseline"
          git worktree add --detach "$baseline" "$BASE_HEAD"
          python3 - <<'PY_PATCH'
          import os, base64, pathlib
          pathlib.Path(os.environ['RUNNER_TEMP'], 'regression.patch').write_bytes(base64.b64decode(os.environ['REGRESSION_PATCH_BASE64'], validate=True))
          PY_PATCH
          git -C "$baseline" apply --check "$RUNNER_TEMP/regression.patch"
          git -C "$baseline" apply "$RUNNER_TEMP/regression.patch"
          set +e
          (cd "$baseline" && cargo test --locked -p kache --lib configured_demand_timeout_restores_after_the_legacy_three_seconds -- --nocapture) > "$EVIDENCE_DIR/regression-red.log" 2>&1
          result=$?
          set -e
          cat "$EVIDENCE_DIR/regression-red.log"
          test "$result" -ne 0
          grep -F 'test daemon::tests::configured_demand_timeout_restores_after_the_legacy_three_seconds ... FAILED' "$EVIDENCE_DIR/regression-red.log"
          grep -F 'configured wrapper wait' "$EVIDENCE_DIR/regression-red.log"
      - name: Verify the same regression passes with the fix
        id: green
        run: |
          set -euo pipefail
          cargo test --locked -p kache --lib configured_demand_timeout_restores_after_the_legacy_three_seconds -- --nocapture 2>&1 | tee "$EVIDENCE_DIR/regression-green.log"
      - name: Run just check
        id: check
        run: |
          set -euo pipefail
          just check 2>&1 | tee "$EVIDENCE_DIR/just-check.log"
      - name: Check documentation
        id: docs
        run: |
          set -euo pipefail
          bash scripts/check-docs.sh 2>&1 | tee "$EVIDENCE_DIR/docs-check.log"
      - name: Record outcomes
        if: always()
        env:
          VERIFY: ${{ steps.verify.outcome }}
          RED: ${{ steps.red.outcome }}
          GREEN: ${{ steps.green.outcome }}
          CHECK: ${{ steps.check.outcome }}
          DOCS: ${{ steps.docs.outcome }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          printf 'verify=%s\nred=%s\ngreen=%s\njust_check=%s\ndocs=%s\n' "$VERIFY" "$RED" "$GREEN" "$CHECK" "$DOCS" | tee "$EVIDENCE_DIR/outcomes.txt"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintainer-preflight-1783-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 7
          if-no-files-found: error

[package]
name = "kache-service"
version = "0.25.0"
edition = "2024"
description = "Remote service shell for kache planner endpoints"
license = "Apache-2.0"
repository = "https://github.com/kunobi-ninja/kache"
rust-version = "1.95"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
kache-core = { path = "../kache-core", default-features = false, features = ["planning"] }
k8s-openapi = { version = "0.28", features = ["v1_34"] }
kube = { version = "4", features = ["client"] }
prometheus = "0.14"
kunobi-auth = { version = "0.12.0", default-features = false, features = ["server", "rust_crypto"] }
kunobi-ha = { git = "https://github.com/kunobi-ninja/kunobi-ha.git", branch = "main" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.14"

[dev-dependencies]
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["time"] }
tower = { version = "0.5", features = ["util"] }

name: Publish crates

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates.io packages
    runs-on: ubuntu-latest
    # Every published GitHub Release publishes to crates.io, release-candidates
    # included (Policy B): the manifest carries the prerelease version (e.g.
    # 0.5.0-rc.4), so `cargo publish` uploads it, and Cargo serves a prerelease
    # only on an explicit `--version`/prerelease requirement — a normal `cargo
    # add`/`cargo install kache` never picks it. The version-consistency gate
    # (tag == manifest) and require-ci-green below are the fail-closed
    # protections; the GitHub `prerelease` flag does not gate THIS publish.
    # That flag is NOT cosmetic for the binary path, though: the release builder
    # (zondax/_workflows/_release-rust.yml@v10) marks rc/alpha/beta/pre/dev tags
    # `--prerelease --latest=false`, so an RC never becomes the GitHub "Latest"
    # release that `@latest` installers / the README badge resolve to — Policy B
    # depends on that boundary behavior. (Drafts never reach here:
    # `release: published` excludes them.)
    # If the crates.io Trusted Publisher config includes a GitHub
    # Environment, add the same `environment: <name>` here. The
    # workflow file name and environment must stay in sync with
    # crates.io's trusted-publisher claims.
    permissions:
      contents: read
      id-token: write
      actions: read # read CI job conclusions for the release commit (gate below)
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}

      # Pinned to the `stable` branch tip; the action reads the toolchain from
      # the ref name, so a SHA pin needs the explicit `toolchain:` input below.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Check release tag matches Cargo manifests (and dep-pin)
        # The version gate: tag version (prerelease suffix included) == kache ==
        # kache-core == kache-core dep-pin (run directly here rather than polling
        # for the CI job, so the manual-UI-release path is gated too without the
        # tag-gated-job / same-SHA run ambiguity that `require-ci-green` would
        # hit). Hermetic (pure manifest reads), so no nix/installer surface
        # before the publish. This is what makes publishing an RC safe: crates.io
        # gets exactly the manifest version the tag was checked against.
        run: ./scripts/check-version-consistency.sh "$RELEASE_TAG"

      - name: Check release tag matches Nix package
        # Cheap consistency gate (<5s): the full `nix build .#kache` is the
        # CI `nix-package` job's responsibility and already runs on the tagged
        # commit. Rebuilding it here only duplicated ~8min of work and pulled
        # in the Determinate/FlakeHub installer as an extra failure surface
        # before the irreversible crates.io publish. The version-match check
        # is what actually guards against tag/manifest drift, so it stays.
        run: |
          version="${RELEASE_TAG#v}"
          nix_version="$(nix eval --raw .#kache.version)"
          if [ "$nix_version" != "$version" ]; then
            echo "Nix package version $nix_version does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Require CI green for this release commit
        # Don't publish to crates.io unless the full CI suite passed for this
        # exact commit. `release: published` can fire from a hand-drafted UI
        # release before/independent of CI; the tag-push path is already gated
        # by the release job's `needs`, but this closes the manual-release hole.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/require-ci-green.sh "$(git rev-parse HEAD)" \
            "Check (Linux)" "Nix package" "CoW filesystem (btrfs)" \
            "E2E smoke (Linux)" "E2E smoke (macOS)" "E2E smoke (Windows)" \
            "Test (macOS)" "Test (Windows)"

      # Package set comes from scripts/crates-io.py (every publishable workspace
      # member, dependency order). Adding a crate does not require a workflow edit.
      - name: Verify publishable packages
        run: cargo package --locked $(python3 scripts/crates-io.py cargo-p-args)

      - name: Authenticate to crates.io
        id: auth
        # Pinned to v1.0.4: the floating @v1 tag still runs on the deprecated
        # Node 20 runtime; v1.0.4 is the first node24 release.
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/crates-io.py publish --version "${RELEASE_TAG#v}"

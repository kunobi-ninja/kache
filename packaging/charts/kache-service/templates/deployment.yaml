apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kache-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kache-service.labels" . | nindent 4 }}
spec:
{{- if eq .Values.planner.persistence.type "pvc" }}
{{- if gt (int .Values.replicaCount) 1 }}
{{- fail "planner.persistence.type=pvc is single-writer: replicaCount must be 1. The PVC is ReadWriteOnce, and the planner DB is written by whichever Pod holds it — nothing in the service arbitrates between two of them." }}
{{- end }}
{{- end }}
  replicas: {{ .Values.replicaCount }}
{{- if eq .Values.planner.persistence.type "pvc" }}
  # Recreate, NOT the RollingUpdate default.
  #
  # RollingUpdate starts the replacement before terminating the old Pod, so two
  # Pods want this volume at once. The PVC is ReadWriteOnce, so on separate
  # nodes the new Pod never mounts and the rollout stalls while the old Pod
  # keeps serving: the release looks healthy while the new version silently
  # never ships. On the same node both mount, and then both run the startup
  # path that opens and seeds the planner DB.
  #
  # Until kache 0.16 the DB was surrealkv, which took an exclusive LOCK, so the
  # second Pod at least crashed loudly. Observed on int-pro: stuck 3d18h across
  # 1061 CrashLoopBackOff restarts, each logging "planner.db/LOCK is already
  # locked by another process". SQLite in WAL mode does not refuse a second
  # opener, so that noise is gone and this guard is now the only thing keeping
  # a surge from quietly producing two writers.
  #
  # Enabling `ha` does not substitute for it. Leader election decides who seeds,
  # not who mounts, so a surging rollout still hits the volume conflict.
  #
  # Not overridable: any value reintroducing surge here brings the conflict
  # back. `ephemeral` gives each Pod its own emptyDir and keeps the
  # RollingUpdate default.
  strategy:
    type: Recreate
{{- else if .Values.updateStrategy }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
{{- end }}
  selector:
    matchLabels:
      {{- include "kache-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kache-service.selectorLabels" . | nindent 8 }}
      {{- if or .Values.signoz.scrape .Values.podAnnotations }}
      annotations:
        {{- if .Values.signoz.scrape }}
        # The cluster SigNoz OTel collector discovers pods by these
        # annotations and scrapes their Prometheus /metrics into SigNoz.
        signoz.io/scrape: "true"
        signoz.io/port: {{ .Values.signoz.port | default .Values.service.port | quote }}
        signoz.io/path: {{ .Values.signoz.path | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.ha.enabled }}
      serviceAccountName: {{ include "kache-service.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: planner
          image: {{ include "kache-service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: KACHE_PLANNER_BIND
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: KACHE_PLANNER_NAME
              value: {{ .Values.planner.name | quote }}
            - name: KACHE_PLANNER_DB_PATH
              value: {{ .Values.planner.dbPath | quote }}
            {{- if .Values.planner.seedStateFile }}
            - name: KACHE_PLANNER_SEED_STATE_FILE
              value: {{ .Values.planner.seedStateFile | quote }}
            {{- end }}
            - name: KACHE_LOG
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.auth.existingSecret }}
            - name: KACHE_PLANNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.existingSecretKey | quote }}
            {{- end }}
            {{- if .Values.ha.enabled }}
            - name: KACHE_HA_ENABLED
              value: "true"
            - name: KACHE_HA_LEASE_NAME
              value: {{ .Values.ha.leaseName | quote }}
            - name: KACHE_HA_NAMESPACE
              {{- if .Values.ha.namespace }}
              value: {{ .Values.ha.namespace | quote }}
              {{- else }}
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
              {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- if .Values.planner.persistence.enabled }}
            - name: planner-data
              mountPath: {{ .Values.planner.persistence.mountPath | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.planner.persistence.enabled }}
      volumes:
        - name: planner-data
          {{- if eq .Values.planner.persistence.type "ephemeral" }}
          emptyDir: {}
          {{- else if eq .Values.planner.persistence.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "kache-service.fullname" . }}
          {{- else }}
          {{- fail "planner.persistence.type must be 'ephemeral' or 'pvc'" }}
          {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

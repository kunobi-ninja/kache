name: Launcher aarch64 probe (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build kache with nixpkgs' native rustc
        run: |
          nix shell nixpkgs#rustc nixpkgs#cargo nixpkgs#stdenv.cc -c sh -c 'rustc -vV && cargo build --locked'

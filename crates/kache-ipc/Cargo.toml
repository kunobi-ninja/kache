[package]
name = "kache-ipc"
version = "1.2.2"
edition = "2024"
rust-version = "1.95"
description = "Local sockets, endpoint naming, and peer checks for Kache."
license = "Apache-2.0"
repository = "https://github.com/kunobi-ninja/kache"
homepage = "https://kunobi.ninja/docs/kache"
readme = "README.md"

[features]
default = []
async = ["interprocess/tokio", "kunobi-daemon/local-async"]

[dependencies]
anyhow = "1"
interprocess = "2.4.4"
kunobi-daemon = { version = "0.10.0", default-features = false, features = ["local"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
blake3 = { version = "1", features = ["pure"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[lints.rust]
warnings = "deny"

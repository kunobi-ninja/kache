# Same source, toolchain and build profile as bench-hk.
name = "bench-hk-sccache"
tags = ["suite:bench", "project:hk", "backend:sccache", "lang:rust", "lang:cc"]

requires = ["cargo", "rustc", "cc"]

setup = [
  "echo '[bench] bench-hk-sccache needs a C compiler (aws-lc-sys cc builder, vendored libgit2); cmake only as the aws-lc-sys fallback.'",
]

prepare = "cargo fetch --locked"

build = """

repo="$(pwd -P)"
prefix_map="-ffile-prefix-map=$repo=. -fdebug-prefix-map=$repo=. -fmacro-prefix-map=$repo=."
export CFLAGS="${CFLAGS:-} $prefix_map"
export CXXFLAGS="${CXXFLAGS:-} $prefix_map"
export SOURCE_DATE_EPOCH=1735689600
export ZERO_AR_DATE=1

cargo build --locked
"""

[env]
HOST_CC = "{cache} cc"
HOST_CXX = "{cache} c++"
CC_KNOWN_WRAPPER_CUSTOM = "sccache"

[source]
kind   = "clone"
repo   = "https://github.com/jdx/hk.git"
ref    = "fc29ead1456ba7c1f62826c284126410a4014b00"
objdir = "target"

[[file]]
path = "rust-toolchain.toml"
content = """
[toolchain]
channel = "1.97.1"
profile = "minimal"
"""

[checks.measure.warm]
min_hit_rate_pct = 50.0

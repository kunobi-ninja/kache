[package]
name = "kache-protocol"
version = "1.2.2"
edition = "2024"
rust-version = "1.95"
description = "Shared data types for Kache's local client and daemon protocol."
license = "Apache-2.0"
repository = "https://github.com/kunobi-ninja/kache"
homepage = "https://kunobi.ninja/docs/kache"
readme = "README.md"

[dependencies]
kache-core = { version = "1.2.2", path = "../kache-core", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
warnings = "deny"

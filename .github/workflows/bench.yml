name: Store performance diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-perf-diagnosis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: kunobi-runners-small
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev git curl ca-certificates \
            file unzip bzip2 xz-utils python3
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.9
          install_args: rust
          cache: false
      - name: Authenticate subject clones
        env:
          GH_JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          header="$(printf 'x-access-token:%s' "$GH_JOB_TOKEN" | base64 -w0)"
          git config --global --replace-all \
            "http.https://github.com/.extraheader" "AUTHORIZATION: basic $header"
      - name: Compare four alternating pairs and retain phase reports
        env:
          RUSTC_WRAPPER: ""
          RUSTUP_TOOLCHAIN: ""
        run: |
          cp scripts/store-perf-diagnose.py "$RUNNER_TEMP/store-perf-diagnose.py"
          python3 "$RUNNER_TEMP/store-perf-diagnose.py"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-perf-diagnostics
          path: ${{ runner.temp }}/store-perf-diagnostics/results/
          retention-days: 14
          if-no-files-found: error

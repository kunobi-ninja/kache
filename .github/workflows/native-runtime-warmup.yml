name: Maintainer native runtime warmup

on:
  push:
    branches: [validation/current-1792-native-runtime]
    paths: [.github/workflows/native-runtime-warmup.yml]

permissions:
  contents: read

jobs:
  native:
    name: Runtime warmup (${{ matrix.runner }})
    if: github.repository == 'kunobi-ninja/kache' && !github.event.repository.private && github.ref == 'refs/heads/validation/current-1792-native-runtime'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            host: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            host: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: pwsh
    env:
      RUSTC_WRAPPER: ""
      KACHE_TEST_USE_CARGO_BIN_EXE: "1"
      CARGO_BUILD_JOBS: "2"
      EXPECTED_NATIVE_HOST: ${{ matrix.host }}
      EXPECTED_HEAD: d23006872d6d745290fa984a85bc48da2ccf8c40
      EXPECTED_TREE: 875c323ec4976222625894667be4d02d7f77caab
    steps:
      - name: Require an ephemeral hosted runner
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          if ($env:RUNNER_KIND -ne 'github-hosted') { throw 'Hosted runner required' }
          $evidence = Join-Path $env:RUNNER_TEMP 'runtime-warmup-evidence'
          [void][IO.Directory]::CreateDirectory($evidence)
          "EVIDENCE_DIR=$evidence" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'runtime-warmup-target')" >> $env:GITHUB_ENV
          "helper=$env:GITHUB_SHA`nrun=$env:GITHUB_RUN_ID`nrunner=$env:RUNNER_KIND`nimage=$env:ImageVersion" | Set-Content (Join-Path $evidence 'provenance.txt')
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: d23006872d6d745290fa984a85bc48da2ccf8c40
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Verify source and parse the owned fixture
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_HEAD) { throw 'Wrong head' }
          if ((git rev-parse 'HEAD^{tree}') -ne $env:EXPECTED_TREE) { throw 'Wrong tree' }
          "tested_head=$env:EXPECTED_HEAD`ntested_tree=$env:EXPECTED_TREE" | Add-Content (Join-Path $env:EVIDENCE_DIR 'provenance.txt')
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'scripts/adoption/windows-runtime-warmup-probe.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Output
            throw 'Fixture syntax is invalid'
          }
      - name: Isolate hosted tool state
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "runtime-warmup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          [void][IO.Directory]::CreateDirectory($scratch)
          foreach ($entry in @{
            RUSTUP_HOME = 'rustup'; CARGO_HOME = 'cargo'; MISE_DATA_DIR = 'mise-data';
            MISE_CACHE_DIR = 'mise-cache'; MISE_STATE_DIR = 'mise-state'; MISE_DL_TMPDIR = 'mise-downloads'
          }.GetEnumerator()) {
            $path = Join-Path $scratch $entry.Value
            [void][IO.Directory]::CreateDirectory($path)
            "$($entry.Key)=$path" >> $env:GITHUB_ENV
          }
      - uses: zondax/actions/setup-runner@8d9900cca4563d4356c5e76c1fa49913158196d4 # v1.5.2
        if: matrix.runner != 'windows-11-arm'
      - uses: zondax/actions/setup-mise@14e656f2dcc6012c36298e3a6e95dc4ae0f022f0 # v1.5.3
        with:
          version: 2026.6.9
          install: true
          install_args: --force rust
          cache: false
          reshim: false
      - name: Select and verify the native pinned toolchain
        run: |
          $expectedHost = $env:EXPECTED_NATIVE_HOST
          $expectedArch = if ($expectedHost.StartsWith('aarch64')) { 'ARM64' } else { 'X64' }
          if ($env:RUNNER_ARCH -ne $expectedArch) { throw 'Runner architecture does not match the requested native host' }
          $nativeBin = Join-Path $env:RUSTUP_HOME "toolchains/1.99.1-$expectedHost/bin"
          if (-not (Test-Path (Join-Path $nativeBin 'rustc.exe'))) { throw "Missing native toolchain: $nativeBin" }
          $actual = & (Join-Path $nativeBin 'rustc.exe') --version --verbose
          if ($LASTEXITCODE -ne 0 -or $actual -notcontains 'release: 1.99.1' -or $actual -notcontains "host: $expectedHost") { throw 'Unexpected compiler identity' }
          $actual | Set-Content (Join-Path $env:EVIDENCE_DIR 'native-toolchain.txt')
          "$nativeBin" >> $env:GITHUB_PATH
      - name: Test native warmup and compatibility controls
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          rustc --version --verbose | Tee-Object (Join-Path $env:EVIDENCE_DIR 'toolchain.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Compiler unavailable' }
          cargo test --locked -p kache --lib warmup -- --nocapture 2>&1 | Tee-Object (Join-Path $env:EVIDENCE_DIR 'warmup-tests.log')
          if ($LASTEXITCODE -ne 0) { throw 'Warmup tests failed' }
          if (-not ([IO.File]::ReadAllText((Join-Path $env:EVIDENCE_DIR 'warmup-tests.log')) -match 'test result: ok\.\s+[1-9][0-9]* passed')) { throw 'Warmup filter selected no passing tests' }
      - name: Build candidate binaries
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo build --locked -p kache --bins 2>&1 | Tee-Object (Join-Path $env:EVIDENCE_DIR 'build.log')
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
          Get-FileHash -Algorithm SHA256 (Join-Path $env:CARGO_TARGET_DIR 'debug/kache.exe'), (Join-Path $env:CARGO_TARGET_DIR 'debug/kache-engine.exe') | Format-List | Out-String | Set-Content (Join-Path $env:EVIDENCE_DIR 'binary-hashes.txt')
      - name: Prove cold compilation, later cache hits, and the blocking opt-out
        run: |
          ./scripts/adoption/windows-runtime-warmup-probe.ps1 -Kache (Join-Path $env:CARGO_TARGET_DIR 'debug/kache.exe') -OutputDirectory (Join-Path $env:EVIDENCE_DIR 'candidate')
      - name: Confirm source remained unchanged
        if: always()
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_HEAD) { throw 'Source head changed' }
          if ((git rev-parse 'HEAD^{tree}') -ne $env:EXPECTED_TREE) { throw 'Source tree changed' }
          git diff --exit-code HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source changed' }
      - name: Upload native acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-warmup-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 7
          if-no-files-found: error

[package]
name = "kache-ipc"
version = "1.2.2"
edition = "2024"
rust-version = "1.95"
description = "Local sockets, endpoint naming, and peer checks for Kache."
license = "Apache-2.0"
repository = "https://github.com/kunobi-ninja/kache"
homepage = "https://kunobi.ninja/docs/kache"
readme = "README.md"

[features]
default = []
async = ["interprocess/tokio", "kunobi-daemon/local-async"]

[dependencies]
kache-protocol = { version = "1.2.2", path = "../kache-protocol" }
serde = "1"
serde_json = "1"
tracing = "0.1"
anyhow = "1"
interprocess = "2.4.6"
kunobi-daemon = { version = "0.10.1", default-features = false, features = ["local"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
find-msvc-tools = "0.1.15"
blake3 = { version = "1", features = ["pure"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "io-util"] }

[lints.rust]
warnings = "deny"

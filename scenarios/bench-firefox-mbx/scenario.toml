# Firefox through mbx: the same subject, release tag and mozconfig knobs as
# bench-firefox, built with `mbx exec ./mach build`.
#
# What this arm covers is narrower than the build. `mbx exec` caches C and C++
# compiles. It sets no RUSTC_WRAPPER, and a Cargo call made inside its session
# runs the real Cargo, so Firefox's Rust crates compile in every phase. The
# report's lookups, hits and misses count C and C++ only; the wall clock is the
# whole build.
#
# The weekly run in bench-sccache.yml dispatches it. The workflow installs the
# latest mbx release and records its version.
name     = "bench-firefox-mbx"
tags     = ["suite:bench", "project:firefox", "backend:mbx", "lang:cc", "lang:cpp", "lang:rust"]

setup        = ["./mach bootstrap --application-choice browser"]
setup_marker = "~/.mozbuild"

# mach picks its bootstrapped clang by absolute path, ahead of PATH, so the
# wrappers `mbx exec` puts on PATH would never see a compile. Put that clang
# on PATH for `mbx exec` to wrap, then name the wrappers as CC and CXX so
# configure records them.
build = """
export PATH="$HOME/.mozbuild/clang/bin:$PATH"
{cache} exec sh -c 'export CC="$(command -v clang)" CXX="$(command -v clang++)"; ./mach build'
"""

[source]
kind   = "clone"
repo   = "https://github.com/mozilla-firefox/firefox.git"
ref    = "FIREFOX_151_0_RELEASE"
objdir = "obj-mbx-bench"

[[file]]
path    = "mozconfig"
content = """
# Generated by kache-scenario - mbx compile-cache benchmark.
# Optimized, non-debug, no LTO/PGO, as in the kache Firefox benchmark.
ac_add_options --enable-optimize
ac_add_options --disable-debug
ac_add_options --disable-tests
rust_target="$(rustc -vV | sed -n 's/^host: //p')"
ac_add_options --host="$rust_target"
ac_add_options --target="$rust_target"

# No compiler wrapper here: CC and CXX arrive from the build command.

# Keep the same noise-reduction knobs as the kache Firefox benchmark.
mk_add_options "export CARGO_INCREMENTAL=0"
mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/{objdir}

# Pin the Firefox build ID so buildid.cpp / application.ini.h are
# byte-identical across clones.
mk_add_options "export MOZ_BUILD_DATE=20260101000000"
"""

# The source patches bench-firefox applies, so every arm builds the same tree.
# Only the cbindgen one is needed to build; the two path patches change Rust
# inputs this arm does not cache.
[[file]]
path         = "build/rust/mozbuild/generate_buildconfig.py"
mode         = "patch"
content_file = "../bench-firefox/patches/firefox-mozbuild-path-clean.patch"

[[file]]
path         = "gfx/wr/webrender/build.rs"
mode         = "patch"
content_file = "../bench-firefox/patches/firefox-generated-source-relative.patch"

[[file]]
path         = "gfx/wr/webrender/src/texture_cache.rs"
mode         = "patch"
content_file = "../bench-firefox/patches/firefox-cbindgen-visibility.patch"

# Advisory only: the number is the point.
[checks.measure.warm]
min_hit_rate_pct = 50.0

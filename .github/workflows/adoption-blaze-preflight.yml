name: Adoption preflight (1819 Blaze executables)

on:
  push:
    branches: [review-contribution/preflight-1819-blaze]
    paths: [.github/workflows/adoption-blaze-preflight.yml]

permissions:
  contents: read

concurrency:
  group: adoption-1819-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Prepare PR 1819 (${{ matrix.platform }})
    if: >-
      github.repository == 'kunobi-ninja/kache' &&
      !github.event.repository.private &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/review-contribution/preflight-1819-blaze'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            install_args: rust github:casey/just
          - platform: macOS
            runner: macos-latest
            install_args: rust
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      RUSTC_WRAPPER: ""
      RUSTC_WORKSPACE_WRAPPER: ""
      KACHE_TEST_USE_CARGO_BIN_EXE: "1"
      SOURCE_HEAD: 9148dd98a41c174f2651fde07577d6fc70737b8b
      SOURCE_TREE: 55e1b902c549eacf7b3d5789ef3cd8f640e1ebbe
    steps:
      - name: Require a disposable hosted runner
        working-directory: ${{ github.workspace }}
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$RUNNER_KIND" = github-hosted
          {
            printf 'CARGO_TARGET_DIR=%s/adoption-target\n' "$RUNNER_TEMP"
            printf 'EVIDENCE_DIR=%s/adoption-evidence\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - name: Check out the maintainer validation helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the pinned candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.SOURCE_HEAD }}
          path: source
          persist-credentials: false
      - name: Verify source and record provenance
        env:
          RUNNER_KIND: ${{ runner.environment }}
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          {
            printf 'helper_head=%s\n' "$GITHUB_SHA"
            printf 'source_head=%s\n' "$SOURCE_HEAD"
            printf 'source_tree=%s\n' "$SOURCE_TREE"
            printf 'runner_environment=%s\n' "$RUNNER_KIND"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'runner_arch=%s\n' "$RUNNER_ARCHITECTURE"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
          } | tee "$EVIDENCE_DIR/provenance.txt"
      - uses: zondax/actions/setup-runner@8d9900cca4563d4356c5e76c1fa49913158196d4 # v1.5.2
      - uses: zondax/actions/setup-mise@14e656f2dcc6012c36298e3a6e95dc4ae0f022f0 # v1.5.3
        with:
          version: 2026.6.9
          install: true
          install_args: ${{ matrix.install_args }}
          cache: false
      - name: Run repository checks
        if: matrix.platform == 'Linux'
        run: |
          set -euo pipefail
          just check 2>&1 | tee "$EVIDENCE_DIR/just-check.log"
      - name: Check documentation routes and source parity
        if: matrix.platform == 'Linux'
        run: |
          set -euo pipefail
          bash scripts/check-docs.sh 2>&1 | tee "$EVIDENCE_DIR/docs-check.log"
          python3 scripts/test-docs.py 2>&1 | tee "$EVIDENCE_DIR/docs-tests.log"
      - name: Check native macOS fallback and supported Blaze routing
        if: matrix.platform == 'macOS'
        run: |
          set -euo pipefail
          cargo test --locked -p kache --test fallback_recovery_test sandbox_preflight_bypasses_denied_server_but_keeps_allowed_server -- --exact --nocapture 2>&1 | tee "$EVIDENCE_DIR/macos-fallback.log"
          if [ "$(uname -m)" = arm64 ]; then
            cargo test --locked -p kache --test blaze_test -- --nocapture 2>&1 | tee "$EVIDENCE_DIR/macos-blaze.log"
          fi
      - name: Verify the candidate was not changed
        if: always()
        run: git diff --exit-code
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adoption-1819-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 7
          if-no-files-found: error

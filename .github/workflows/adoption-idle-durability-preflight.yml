name: Adoption preflight (1803 complete)

on:
  push:
    branches: [review-contribution/preflight-1803-complete]
    paths:
      - .github/workflows/adoption-idle-durability-preflight.yml
      - scripts/adoption/idle-durability-controls.py
      - scripts/adoption/windows-environment-controls.py

permissions:
  contents: read

concurrency:
  group: adoption-1803-complete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Adoption preflight (${{ matrix.platform }})
    if: >-
      github.repository == 'kunobi-ninja/kache' &&
      !github.event.repository.private &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/review-contribution/preflight-1803-complete'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            install_args: ""
          - platform: Windows
            runner: windows-latest
            install_args: rust
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      RUSTC_WRAPPER: ""
      RUSTC_WORKSPACE_WRAPPER: ""
      KACHE_TEST_USE_CARGO_BIN_EXE: "1"
      SOURCE_HEAD: bd0a9acb431d2dca9eddab2d2daeca7a50171a4e
      SOURCE_TREE: f2fb09683d18c8da75f196344b5e05502d054947
    steps:
      - name: Require a disposable hosted runner
        working-directory: ${{ github.workspace }}
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$RUNNER_KIND" = github-hosted
          {
            printf 'CARGO_TARGET_DIR=%s/adoption-1803-target\n' "$RUNNER_TEMP"
            printf 'EVIDENCE_DIR=%s/adoption-1803-evidence\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - name: Check out the maintainer validation helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the pinned candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.SOURCE_HEAD }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source and record provenance
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          {
            printf 'helper_head=%s\n' "$GITHUB_SHA"
            printf 'source_head=%s\n' "$SOURCE_HEAD"
            printf 'source_tree=%s\n' "$SOURCE_TREE"
            printf 'runner_environment=%s\n' "$RUNNER_KIND"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
          } | tee "$EVIDENCE_DIR/provenance.txt"
      - uses: zondax/actions/setup-runner@8d9900cca4563d4356c5e76c1fa49913158196d4
      - uses: zondax/actions/setup-mise@14e656f2dcc6012c36298e3a6e95dc4ae0f022f0
        with:
          version: 2026.6.9
          install: true
          install_args: ${{ matrix.install_args }}
          cache: false
      - name: Run just check
        if: matrix.platform == 'Linux'
        run: |
          set -euo pipefail
          just check 2>&1 | tee "$EVIDENCE_DIR/just-check.log"
      - name: Verify that actual durability regressions are caught
        if: matrix.platform == 'Linux'
        run: python3 ../scripts/adoption/idle-durability-controls.py
      - name: Type-check Windows and run the parser and integration regressions
        if: matrix.platform == 'Windows'
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee "$EVIDENCE_DIR/windows-clippy.log"
          cargo test --locked -p kache --lib daemon::execution::tests:: 2>&1 | tee "$EVIDENCE_DIR/windows-environment.log"
          cargo test --locked --test integration_test 2>&1 | tee "$EVIDENCE_DIR/windows-integration.log"
          python3 ../scripts/adoption/windows-environment-controls.py
      - name: Verify that the candidate was restored
        if: always()
        run: git diff --exit-code
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: adoption-1803-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 7
          if-no-files-found: error

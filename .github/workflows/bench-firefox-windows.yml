name: Windows native qualification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  conftest:
    name: Native Windows ARM64 configure probes
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - run: python .github/validation/arm-conftest.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-arm-conftest
          path: arm-conftest.json
          retention-days: 7
  refs:
    name: Native ReFS fingerprint
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: verification
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: d2e2b93a8fe91432856b304dfbe8d88cbe84ba3c
          path: source
          persist-credentials: false
      - name: Exercise real ReFS file identity
        working-directory: source
        shell: pwsh
        run: '& ../verification/.github/validation/refs.ps1'

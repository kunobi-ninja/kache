name: Adoption preflight November 10

on:
  push:
    branches: [validation/adoptions-20261110]
    paths: [.github/workflows/adoptions-20261110.yml]

permissions:
  contents: read

concurrency:
  group: adoption-preflight-20261110
  cancel-in-progress: false

jobs:
  check:
    name: just check PR${{ matrix.pr }}
    if: github.repository == 'kunobi-ninja/kache' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: [{"pr": 1876, "head": "5e715bda2e9035c81aade960eafc346f54677a51", "tree": "928c193f72ceb88f1f4bc1ec57a7846f2759a1dc"}]
    env:
      RUSTC_WRAPPER: ""
      KACHE_TEST_USE_CARGO_BIN_EXE: "1"
      EXPECTED_HEAD: ${{ matrix.head }}
      EXPECTED_TREE: ${{ matrix.tree }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ matrix.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned candidate
        run: |
          mkdir -p "$RUNNER_TEMP/adoption-evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git log -1 --format='%H%n%T%n%an <%ae>%n%cn <%ce>' | tee "$RUNNER_TEMP/adoption-evidence/candidate.txt"
          printf '%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$RUNNER_OS" > "$RUNNER_TEMP/adoption-evidence/runner.txt"
          test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: zondax/actions/setup-runner@8d9900cca4563d4356c5e76c1fa49913158196d4 # v1.5.2
      - uses: zondax/actions/setup-mise@14e656f2dcc6012c36298e3a6e95dc4ae0f022f0 # v1.5.3
        with:
          install: true
          version: 2026.6.9
          cache: false
      - name: Run required pre-publication checks
        run: just check 2>&1 | tee "$RUNNER_TEMP/adoption-evidence/just-check.log"
      - name: Check documentation and configuration references
        if: matrix.pr != 1866
        run: bash scripts/check-docs.sh 2>&1 | tee "$RUNNER_TEMP/adoption-evidence/check-docs.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: adoption-${{ matrix.pr }}-${{ matrix.head }}
          path: ${{ runner.temp }}/adoption-evidence/
          retention-days: 7

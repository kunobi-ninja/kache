name: Maintainer preflight

on:
  push:
    branches: [validation/musl-timespec-2.1.0]
    paths: [.github/workflows/maintainer-preflight.yml]

permissions:
  contents: read

jobs:
  preflight:
    name: Release dependencies, MSRV and repository checks
    if: github.repository == 'kunobi-ninja/kache' && !github.event.repository.private && github.ref == 'refs/heads/validation/musl-timespec-2.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: ""
      RUSTC_WORKSPACE_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
      KACHE_TEST_USE_CARGO_BIN_EXE: "1"
      CARGO_BUILD_JOBS: "2"
      EXPECTED_HEAD: 3ebb554cfbf9d3f5681bd88ea0362040ddd317e6
      EXPECTED_TREE: fa7cb41226819cca2d177a8a111c1be66bde9f41
      BASE_HEAD: 1f7e8bdf806911005446bc6113e46217b0586023
      BASE_TREE: 1ac950a8778d9cd6ea060a7048a080118d222179
      EXPECTED_VERSION: "2.1.1"
      CARGO_EDIT_VERSION: "0.13.11"
    steps:
      - name: Record provenance and require an ephemeral hosted runner
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/musl-timespec/evidence"
          mkdir -p "$evidence"
          printf 'EVIDENCE_DIR=%s\n' "$evidence" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/musl-timespec/target" >> "$GITHUB_ENV"
          printf 'BASELINE_DIR=%s\n' "$RUNNER_TEMP/musl-timespec/baseline" >> "$GITHUB_ENV"
          printf 'helper=%s\nrun=%s\nrunner=%s\nimage=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RUNNER_KIND" "$ImageVersion" | tee "$evidence/provenance.txt"
          test "$RUNNER_KIND" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 3ebb554cfbf9d3f5681bd88ea0362040ddd317e6
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate and baseline
        id: verify
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git rev-parse "$BASE_HEAD^{tree}")" = "$BASE_TREE"
          git worktree add --detach "$BASELINE_DIR" "$BASE_HEAD"
          printf 'tested_head=%s\ntested_tree=%s\nbaseline_head=%s\nbaseline_tree=%s\n' "$EXPECTED_HEAD" "$EXPECTED_TREE" "$BASE_HEAD" "$BASE_TREE" >> "$EVIDENCE_DIR/provenance.txt"
      - uses: zondax/actions/setup-runner@8d9900cca4563d4356c5e76c1fa49913158196d4 # v1.5.2
      - uses: zondax/actions/setup-mise@14e656f2dcc6012c36298e3a6e95dc4ae0f022f0 # v1.5.3
        with:
          version: 2026.6.9
          install: true
          cache: false
      - name: Verify toolchain and install musl standard libraries
        id: toolchain
        run: |
          set -euo pipefail
          rustc --version --verbose | tee "$EVIDENCE_DIR/toolchain.txt"
          rustc --version | grep -E '^rustc 1\.99\.1 '
          cargo --version | tee -a "$EVIDENCE_DIR/toolchain.txt"
          just --version | tee -a "$EVIDENCE_DIR/toolchain.txt"
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl 2>&1 | tee "$EVIDENCE_DIR/target-setup.log"
      - name: Install pinned cargo-edit for the canonical bump
        id: cargo_edit
        run: |
          set -euo pipefail
          install_started=$(date +%s)
          install_exit=0
          cargo install --locked --version "=$CARGO_EDIT_VERSION" --bin cargo-set-version --root "$RUNNER_TEMP/cargo-edit-$CARGO_EDIT_VERSION" --target-dir "$RUNNER_TEMP/cargo-edit-target" cargo-edit 2>&1 | tee "$EVIDENCE_DIR/cargo-edit-install.log" || install_exit=$?
          printf 'cargo_edit_install\t%s\t%s\t%s\n' "$CARGO_EDIT_VERSION" "$install_exit" "$(( $(date +%s) - install_started ))" >> "$EVIDENCE_DIR/metrics.tsv"
          test "$install_exit" -eq 0
          printf '%s/bin\n' "$RUNNER_TEMP/cargo-edit-$CARGO_EDIT_VERSION" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cargo-edit-$CARGO_EDIT_VERSION/bin/cargo-set-version" set-version --version | tee "$EVIDENCE_DIR/cargo-edit-version.txt"
          grep -Fx "cargo-edit-set-version $CARGO_EDIT_VERSION" "$EVIDENCE_DIR/cargo-edit-version.txt"
      - name: Require the exact deprecated-alias failure on both baseline targets
        id: baseline
        run: |
          set -euo pipefail
          cd "$BASELINE_DIR"
          failures=0
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            log="$EVIDENCE_DIR/baseline-$target.log"
            check_started=$(date +%s)
            check_exit=0
            cargo check --locked --package kache-fs --all-features --lib --target "$target" --message-format=json > "$log" 2>&1 || check_exit=$?
            cat "$log"
            printf 'baseline\t%s\t%s\t%s\n' "$target" "$check_exit" "$(( $(date +%s) - check_started ))" >> "$EVIDENCE_DIR/metrics.tsv"
            if [ "$check_exit" -ne 101 ]; then
              failures=1
              continue
            fi
            if ! python3 - "$log" <<'PY'
          import json, sys
          errors = []
          for line in open(sys.argv[1], encoding="utf-8"):
              try:
                  item = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if item.get("reason") == "compiler-message":
                  message = item["message"]
                  if message["level"] == "error":
                      errors.append(message)
          def expected(message):
              return ("deprecated" in message["message"]
                      and "libc::time_t" in message["message"]
                      and any(span["is_primary"]
                              and span["file_name"].replace("\\", "/").endswith("crates/kache-fs/src/clock.rs")
                              and span["line_start"] == 50
                              for span in message["spans"]))
          if not errors or not all(expected(message) for message in errors):
              raise SystemExit("Baseline failed for an unexpected diagnostic")
          print("Observed only the exact deprecated libc::time_t error in clock.rs:50")
          PY
            then
              failures=1
            fi
          done
          test "$failures" -eq 0
      - name: Check the candidate on both musl targets
        id: candidate
        run: |
          set -euo pipefail
          failures=0
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            log="$EVIDENCE_DIR/candidate-$target.log"
            check_started=$(date +%s)
            check_exit=0
            cargo check --locked --package kache-fs --all-features --lib --target "$target" > "$log" 2>&1 || check_exit=$?
            cat "$log"
            printf 'candidate\t%s\t%s\t%s\n' "$target" "$check_exit" "$(( $(date +%s) - check_started ))" >> "$EVIDENCE_DIR/metrics.tsv"
            if [ "$check_exit" -ne 0 ]; then failures=1; fi
          done
          test "$failures" -eq 0
      - name: Check the advertised minimum Rust versions
        id: msrv
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 1.95.0 --profile minimal 2>&1 | tee "$EVIDENCE_DIR/msrv-toolchain-setup.log"
          for toolchain in 1.93.0 1.95.0; do
            rustup run "$toolchain" rustc --version --verbose | tee "$EVIDENCE_DIR/toolchain-$toolchain.txt"
            rustup run "$toolchain" rustc --version | grep -F "rustc $toolchain "
            rustup run "$toolchain" cargo --version | tee -a "$EVIDENCE_DIR/toolchain-$toolchain.txt"
          done
          core_started=$(date +%s)
          core_exit=0
          RUSTC="$(rustup which --toolchain 1.93.0 rustc)" RUSTDOC="$(rustup which --toolchain 1.93.0 rustdoc)" CARGO_TARGET_DIR="$RUNNER_TEMP/musl-timespec/msrv-core-1.93.0" \
            rustup run 1.93.0 cargo check --locked --package kache-core --all-features --all-targets 2>&1 | tee "$EVIDENCE_DIR/msrv-core-1.93.0.log" || core_exit=$?
          printf 'msrv_core\t1.93.0\t%s\t%s\n' "$core_exit" "$(( $(date +%s) - core_started ))" >> "$EVIDENCE_DIR/metrics.tsv"
          workspace_started=$(date +%s)
          workspace_exit=0
          RUSTC="$(rustup which --toolchain 1.95.0 rustc)" RUSTDOC="$(rustup which --toolchain 1.95.0 rustdoc)" CARGO_TARGET_DIR="$RUNNER_TEMP/musl-timespec/msrv-workspace-1.95.0" \
            rustup run 1.95.0 cargo check --locked --workspace --all-features --all-targets 2>&1 | tee "$EVIDENCE_DIR/msrv-workspace-1.95.0.log" || workspace_exit=$?
          printf 'msrv_workspace\t1.95.0\t%s\t%s\n' "$workspace_exit" "$(( $(date +%s) - workspace_started ))" >> "$EVIDENCE_DIR/metrics.tsv"
          # The per-command overrides above must leave the release toolchain active.
          rustc --version | tee "$EVIDENCE_DIR/toolchain-restored.txt"
          rustc --version | grep -E '^rustc 1\.99\.1 '
          test "$core_exit" -eq 0
          test "$workspace_exit" -eq 0
      - name: Run the canonical version bump idempotently
        id: bump
        run: |
          set -euo pipefail
          test "$(command -v cargo-set-version)" = "$RUNNER_TEMP/cargo-edit-$CARGO_EDIT_VERSION/bin/cargo-set-version"
          bump_started=$(date +%s)
          bump_exit=0
          just bump "$EXPECTED_VERSION" 2>&1 | tee "$EVIDENCE_DIR/just-bump.log" || bump_exit=$?
          printf 'just_bump\t%s\t%s\t%s\n' "$EXPECTED_VERSION" "$bump_exit" "$(( $(date +%s) - bump_started ))" >> "$EVIDENCE_DIR/metrics.tsv"
          test "$bump_exit" -eq 0
          git diff --exit-code HEAD
      - name: Run just check
        id: check
        run: |
          set -euo pipefail
          check_started=$(date +%s)
          check_exit=0
          just check 2>&1 | tee "$EVIDENCE_DIR/just-check.log" || check_exit=$?
          printf 'just_check\tworkspace\t%s\t%s\n' "$check_exit" "$(( $(date +%s) - check_started ))" >> "$EVIDENCE_DIR/metrics.tsv"
          exit "$check_exit"
      - name: Check documentation routes and installation pins
        id: docs
        run: |
          set -euo pipefail
          docs_started=$(date +%s)
          docs_exit=0
          bash scripts/check-docs.sh 2>&1 | tee "$EVIDENCE_DIR/docs-check.log" || docs_exit=$?
          printf 'docs_check\tworkspace\t%s\t%s\n' "$docs_exit" "$(( $(date +%s) - docs_started ))" >> "$EVIDENCE_DIR/metrics.tsv"
          docs_tests_started=$(date +%s)
          docs_tests_exit=0
          python3 scripts/test-docs.py 2>&1 | tee "$EVIDENCE_DIR/docs-tests.log" || docs_tests_exit=$?
          printf 'docs_tests\tworkspace\t%s\t%s\n' "$docs_tests_exit" "$(( $(date +%s) - docs_tests_started ))" >> "$EVIDENCE_DIR/metrics.tsv"
          test "$docs_exit" -eq 0
          test "$docs_tests_exit" -eq 0
      - name: Audit every workspace member and fuzz
        id: audit
        run: |
          set -euo pipefail
          cargo deny --version | tee "$EVIDENCE_DIR/cargo-deny-version.txt"
          cargo deny fetch db 2>&1 | tee "$EVIDENCE_DIR/advisory-db-fetch.log"
          audit_started=$(date +%s)
          audit_exit=0
          just audit 2>&1 | tee "$EVIDENCE_DIR/just-audit.log" || audit_exit=$?
          printf 'just_audit\tmembers_and_fuzz\t%s\t%s\n' "$audit_exit" "$(( $(date +%s) - audit_started ))" >> "$EVIDENCE_DIR/metrics.tsv"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          cargo_home = pathlib.Path(os.environ.get("CARGO_HOME", str(pathlib.Path.home() / ".cargo")))
          records = []
          for database in sorted((cargo_home / "advisory-dbs").iterdir()):
              if (database / ".git").exists():
                  def git(*arguments):
                      return subprocess.check_output(["git", "-C", str(database), *arguments], text=True).strip()
                  records.append({"directory": database.name,
                                  "head": git("rev-parse", "HEAD"),
                                  "commit_time": git("log", "-1", "--format=%cI")})
          if not records:
              raise SystemExit("No fetched advisory database provenance found")
          output = pathlib.Path(os.environ["EVIDENCE_DIR"]) / "advisory-db-provenance.json"
          output.write_text(json.dumps(records, indent=2) + "\n")
          PY
          exit "$audit_exit"
      - name: Verify source trees stayed clean
        id: clean
        if: always() && steps.verify.outcome == 'success'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git -C "$BASELINE_DIR" rev-parse HEAD)" = "$BASE_HEAD"
          test "$(git -C "$BASELINE_DIR" rev-parse 'HEAD^{tree}')" = "$BASE_TREE"
          git diff --exit-code HEAD
          git -C "$BASELINE_DIR" diff --exit-code HEAD
      - name: Record outcomes
        if: always()
        env:
          VERIFY: ${{ steps.verify.outcome }}
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          CARGO_EDIT: ${{ steps.cargo_edit.outcome }}
          BASELINE: ${{ steps.baseline.outcome }}
          CANDIDATE: ${{ steps.candidate.outcome }}
          MSRV: ${{ steps.msrv.outcome }}
          BUMP: ${{ steps.bump.outcome }}
          CHECK: ${{ steps.check.outcome }}
          DOCS: ${{ steps.docs.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          CLEAN: ${{ steps.clean.outcome }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          printf 'verify=%s\ntoolchain=%s\ncargo_edit=%s\nbaseline=%s\ncandidate=%s\nmsrv=%s\nbump=%s\njust_check=%s\ndocs=%s\naudit=%s\nclean=%s\n' "$VERIFY" "$TOOLCHAIN" "$CARGO_EDIT" "$BASELINE" "$CANDIDATE" "$MSRV" "$BUMP" "$CHECK" "$DOCS" "$AUDIT" "$CLEAN" | tee "$EVIDENCE_DIR/outcomes.txt"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: musl-timespec-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 7
          if-no-files-found: error

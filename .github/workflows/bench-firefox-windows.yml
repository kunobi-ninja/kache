name: Native MSVC archive rebuild comparison
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ring:
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: 1.100.0-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 21737f35e57050d12f0ecfd6f062b0ac9da2320b
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 2361c44dac64a87527d6858597507ddce67aa2f4
          path: candidate
          persist-credentials: false
      - name: Build baseline and candidate for the native MSVC host
        run: |
          rustup toolchain install 1.100.0-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc -Vv
          foreach ($arm in @("baseline", "candidate")) {
            Push-Location $arm
            git rev-parse HEAD
            cargo build --release --locked --bin kache --bin kache-engine
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Pop-Location
          }
      - name: Compare ring and inspect COFF archive fields
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where lib.exe
          cl.exe 2>&1
          python .github\workflows\probe-ring-native.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-ring-evidence
          path: ${{ runner.temp }}/ring-evidence
          retention-days: 5

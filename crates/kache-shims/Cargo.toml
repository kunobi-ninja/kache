[package]
name = "kache-shims"
version = "0.27.0"
edition = "2024"
rust-version = "1.95"
description = "Upgrade-safe paths to an installed binary, and compiler-name shim farms that point at it."
license = "Apache-2.0"
repository = "https://github.com/kunobi-ninja/kache"
homepage = "https://kunobi.ninja/docs/kache"
documentation = "https://docs.rs/kache-shims"
readme = "README.md"
keywords = ["shims", "homebrew", "nix", "mise", "compiler"]
categories = ["development-tools::build-utils", "filesystem"]

[dependencies]
kache-fs = { version = "0.27.0", path = "../kache-fs" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std", "handle-panics"] }
tempfile = "3"

[lints.rust]
warnings = "deny"
